<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Brand video template</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
#stage{position:relative;overflow:hidden;perspective:2400px}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%;opacity:.5}
.p{position:absolute;left:0;top:0;border-radius:50%}
#vig{position:absolute;inset:0;pointer-events:none;z-index:50}
#grain{position:absolute;z-index:51;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
.scene{position:absolute;inset:0;visibility:hidden}
.cam{position:absolute;inset:0}
/* text: every word is a mask; letters rise inside it. Padding gives room for ascenders, descenders and italic overhang; negative margins keep layout tight. */
.txt{position:absolute;line-height:1.1;white-space:normal;overflow-wrap:normal}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em .12em .26em .06em;margin:-.14em -.12em -.26em -.06em}
.l{display:inline-block;will-change:transform,filter}
.kw{font-style:italic;font-weight:400 !important;letter-spacing:-.01em !important}
.device{position:absolute;transform-style:preserve-3d}
.screen{position:absolute;overflow:hidden;background:#fafaf9}
.scroller{position:absolute;left:0;top:0;width:100%}
.scroller img{position:absolute;left:0;top:0;width:100%;display:block}
.bar{position:absolute;left:0;top:0;right:0;display:flex;align-items:center}
.bar i{border-radius:50%;background:#3a3236;display:block}
.anchor{position:absolute;width:2px;height:2px}
.cursor{position:absolute;left:0;top:0;z-index:20}
.ripple{position:absolute;border-radius:50%;z-index:19;opacity:0}
.cta{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#fff;white-space:nowrap}
</style></head><body><div id="stage"></div>
<script src="lib/gsap.min.js"></script>
<script>
const FORMATS={'16x9':[1920,1080],'9x16':[1080,1920],'1x1':[1080,1080]};
const SAFE={'16x9':{x:.06,t:.08,b:.08},'9x16':{x:.08,t:.09,b:.12},'1x1':{x:.07,t:.07,b:.07}};
const q=new URLSearchParams(location.search);
const $=(tag,cls,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

async function main(){
const root='../../';
const plan=await (await fetch(root+q.get('plan'))).json();
const brand=await (await fetch(root+plan.brand)).json();
const [W,H]=FORMATS[plan.format];const S=SAFE[plan.format];const u=Math.min(W,H)/1080;const portrait=H>W;
const safe={l:W*S.x,r:W-W*S.x,t:H*S.t,b:H-H*S.b};safe.w=safe.r-safe.l;safe.h=safe.b-safe.t;
// STYLE: a recipe from styles/<name>.json (typography, background, text motion, transitions, device, post, audio)
const styleName=plan.style||((plan.theme||brand.theme)==='light'?'light-corporate':'dark-glow');
const STY=await (await fetch(root+'styles/'+styleName+'.json')).json();if(STY.deprecated)throw new Error('Style '+styleName+' is deprecated: '+STY.deprecated);

const EASE=MO.enter,BL=MO.blur,ROT=MO.tilt,OVR=MO.overshoot,CAM=MO.camera,LOGO=LIGHT?'onLight':'onDark';
const UP=F.display.transform==='uppercase';
const faces=[F.display,F.keyword,F.label].filter((f,i,a)=>a.findIndex(g=>g.family===f.family)===i)
  .map(f=>`@font-face{font-family:${f.family};src:url(${root+f.src}) format("truetype");font-weight:100 900;${f.style==='italic'?'font-style:italic;':''}}`).join('');
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:faces+`
  .txt{line-height:${F.display.lineHeight||1.1};${UP?'text-transform:uppercase;':''}}
  .kw{font-family:${F.keyword.family};font-style:${F.keyword.style||'normal'};font-weight:${F.keyword.weight||400} !important}
  .kw .l{background:var(--kwbg);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lab{font-family:${F.label.family}}
  ${TX.sticker?`.txt .m{background:#fff;border-radius:.28em;margin:.04em .06em;box-shadow:.06em .07em 0 #16110f;border:.035em solid #16110f}.txt .kw .m{background:var(--stk,#f4dc2a);color:var(--stkfg,#16110f)}.txt .kw .l{background:none;color:inherit;-webkit-background-clip:border-box}`:''}`}));

const st=document.getElementById('stage');Object.assign(st.style,{width:W+'px',height:H+'px',background:R.background,color:R.text,fontFamily:F.display.family});
st.style.setProperty('--kwbg',`linear-gradient(90deg,${R.keywordGradient.join(',')})`);
document.body.style.width=W+'px';document.body.style.height=H+'px';
const rnd=mulberry32(plan.seed||1);
// background by recipe type
const glows=BG.type==='glow'?R.glows.map((c,i)=>{const s=(portrait?1.1:.9)*Math.max(W,H)*(.55+.12*i);
  return $('div','glow',st,{width:s+'px',height:s+'px',left:(i===1?W-s*.55:-s*.35+i*W*.3)+'px',top:(i===1?H-s*.6:-s*.35+i*H*.25)+'px',background:`radial-gradient(circle,${c} 0%,transparent 65%)`,filter:`blur(${90*u}px)`,opacity:LIGHT?.16:.5})}):[];
if(BG.type==='paper-grid'){const g=60*u;$('div','',st,{position:'absolute',inset:0,backgroundImage:`linear-gradient(${R.text}12 1px,transparent 1px),linear-gradient(90deg,${R.text}12 1px,transparent 1px)`,backgroundSize:`${g}px ${g}px`});
  $('div','',st,{position:'absolute',left:safe.l+'px',right:W-safe.r+'px',top:safe.t*.62+'px',height:'2px',background:R.text,opacity:.8});
  $('div','',st,{position:'absolute',left:safe.l+'px',right:W-safe.r+'px',bottom:(H-safe.b)*.6+'px',height:'1px',background:R.text,opacity:.5})}
const flash=$('div','glow',st,{width:900*u+'px',height:900*u+'px',left:W/2-450*u+'px',top:H/2-450*u+'px',background:`radial-gradient(circle,${R.glows[2]} 0%,transparent 68%)`,filter:`blur(${80*u}px)`,opacity:0,display:BG.type==='glow'?'block':'none'});
const parts=[];
if(BG.type==='confetti'){const pal=Object.values(brand.palette);for(let i=0;i<Math.round(16*Math.sqrt(W*H/(1920*1080)));i++){const s=(14+rnd()*46)*u;const d=$('div','p',st,{width:s+'px',height:s+'px',background:pal[i%pal.length]});
  parts.push({d,x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*30*u,vy:(-10-rnd()*25)*u,ph:rnd()*6.28,o:.9,amp:30*u})}}
else for(let i=0;i<Math.round((BG.particles||0)*W*H/(1920*1080));i++){const s=(1+rnd()*3.2)*u;const d=$('div','p',st,{width:s+'px',height:s+'px',background:R.particles});
 parts.push({d,x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*18*u,vy:(-6-rnd()*22)*u,ph:rnd()*6.28,o:.12+rnd()*.4,amp:14*u})}
const layer=$('div','',st,{position:'absolute',inset:0});
if(BG.vignette)$('div','',st,{position:'absolute',inset:0,zIndex:50,pointerEvents:'none',background:'radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.72) 100%)'});
st.insertAdjacentHTML('beforeend',`<svg id="grain" width="${W+200}" height="${H+200}" style="left:-100px;top:-100px"><filter id="nf"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#nf)"/></svg>`);
const turb=document.getElementById('turb'),grain=document.getElementById('grain');grain.style.opacity=BG.grain||0;if(!BG.grain)grain.style.display='none';
let SC={fg:R.text,kw:null};  // per-scene colors (flat-cycle)

// text builder with auto-fit
const textEls=[];
function makeText(parent,copy,{max,min=20*u,width,maxLines=2,align='center',weight=F.display.weight,tracking=F.display.tracking,color=SC.fg,x,y,anchorY='top'}){

  let lastM=null;copy.split(/(\*[^*]+\*)/).forEach(seg=>{if(!seg)return;const kw=seg.startsWith('*');const host=kw?$('span','kw',el):el;
    if(!kw&&lastM){const pm=seg.match(/^[.,!?;:…]+/);if(pm){[...pm[0]].forEach(ch=>{$('span','l',lastM).textContent=ch});seg=seg.slice(pm[0].length);if(!seg)return}}  // keep trailing punctuation attached to the keyword
    (kw?seg.slice(1,-1):seg).split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){host.appendChild(document.createTextNode(' '));return}
      const m=$('span','m',host);lastM=m;if(TX.sticker)m.style.transform=`rotate(${(rnd()-.5)*7}deg)`;[...w].forEach(ch=>{$('span','l',m).textContent=ch})})});
  let fs=max;const lines=()=>new Set([...el.querySelectorAll('.m')].map(m=>Math.round(m.offsetTop))).size;
  const over=()=>[...el.querySelectorAll('.m')].some(m=>m.getBoundingClientRect().right>el.getBoundingClientRect().right+1||m.getBoundingClientRect().left<el.getBoundingClientRect().left-1);
  for(;fs>min;fs*=.97){el.style.fontSize=fs+'px';if(lines()<=maxLines&&el.scrollWidth<=el.clientWidth)break}
  el.style.fontSize=fs+'px';
  el.style.top=(anchorY==='center'?y-el.offsetHeight/2:anchorY==='bottom'?y-el.offsetHeight:y)+'px';
  textEls.push(el);return el}

const B=60/plan.bpm;let t0=0;const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
const cuts=[],qaTimes=[];
const show=(el,a,b)=>{tl.set(el,{visibility:'visible'},a);tl.set(el,{visibility:'hidden'},b)};
const letters=(el,at,total=.45,dur=.6)=>{const ls=el.querySelectorAll('.l'),ms=el.querySelectorAll('.m');const mode=TX.enter;
  if(mode==='slam'){tl.fromTo(ms,{scale:1.9,opacity:0,yPercent:-10},{scale:1,opacity:1,yPercent:0,duration:Math.min(dur,.45),stagger:Math.min(.12,total/ms.length+.04),ease:OVR},at);return}

    tl.fromTo(ls,{yPercent:30,opacity:0},{yPercent:0,opacity:1,duration:dur+.2,stagger:Math.min(.02,total/ls.length),ease:EASE},at);return}
  if(mode==='pop'){tl.fromTo(ms,{scale:0,rotation:'-=12'},{scale:1,rotation:'+=12',duration:dur+.25,stagger:Math.min(.1,total/ms.length+.03),ease:OVR},at);
    tl.fromTo(ls,{yPercent:120},{yPercent:0,duration:dur,stagger:Math.min(.03,total/ls.length),ease:EASE},at+.05);return}
  tl.fromTo(ls,{yPercent:120,filter:`blur(${BL*u}px)`,opacity:0},{yPercent:0,filter:'blur(0px)',opacity:1,duration:dur,stagger:Math.min(.04,total/ls.length),ease:EASE},at)};
const darkBg=c=>{const n=parseInt(c.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000<140};
const logoImg=(parent,kind,w,style,variant)=>{const i=$('img','',parent,Object.assign({position:'absolute',width:w+'px'},style));i.src=root+brand.logo[kind][variant||LOGO];return i};
// corner mark (small full logo on dark), shown during content scenes
const cmW=(portrait?260:240)*u;const corner=$('div','',st,{position:'absolute',left:safe.l+'px',top:(portrait?safe.t*.5:safe.t*.55)+'px',width:cmW+'px',height:cmW/brand.logo.full.aspect+'px',zIndex:40,opacity:0});
const cornerL=logoImg(corner,'full',cmW,{left:0,top:0},'onLight'),cornerD=logoImg(corner,'full',cmW,{left:0,top:0},'onDark');gsap.set(LIGHT?cornerD:cornerL,{opacity:0});

const OV=STY.transition.overlap??.35, WIPE=STY.transition.type==='panel-wipe';
const exitLetters=(el,at,dur=.42)=>{const ls=el.querySelectorAll('.l'),ms=el.querySelectorAll('.m');
  if(TX.enter==='slam'){tl.to(ms,{scale:.7,opacity:0,duration:Math.min(dur,.25),stagger:.03,ease:'power3.in'},at);return}
  if(TX.enter==='wipe'){tl.to(ms,{clipPath:'inset(-20% -10% -30% 100%)',duration:dur,stagger:.03,ease:'power2.in'},at);return}
  if(TX.enter==='pop'){tl.to(ms,{scale:0,duration:dur,stagger:.025,ease:'back.in(2)'},at);return}
  tl.to(ls,{yPercent:-120,opacity:0,filter:`blur(${BL*.6*u}px)`,duration:dur,stagger:Math.min(.02,.12/ls.length),ease:'power3.in'},at)};
const total=plan.scenes.reduce((s,x)=>s+x.beats*B,0);
let prev=null;const hookIcon={};
for(const [si,sc] of plan.scenes.entries()){
 const D=sc.beats*B, A=t0; t0+=D; cuts.push(A);
 const vr=mulberry32((plan.seed||1)+si*101), vt=()=>.3+vr()*.3, vd=()=>.5+vr()*.3;   // varied text timing per scene
 const last=si===plan.scenes.length-1, next=plan.scenes[si+1];
 const el=$('section','scene',layer);show(el,Math.max(0,A-OV),last?total+.01:A+D+OV);
 // per-scene colors: flat-cycle backgrounds rotate through the recipe's cycle
 if(BG.type==='flat-cycle'){const c=BG.cycle[si%BG.cycle.length];SC={fg:c.fg,kw:c.kw,bg:c.bg};$('div','',el,{position:'absolute',inset:'-2px',background:c.bg});}
 else SC={fg:R.text,kw:TX.keyword==='gradient'?null:R.accent,bg:R.background};
 if(SC.kw)el.style.setProperty('--kwbg',`linear-gradient(${SC.kw},${SC.kw})`);
 if(TX.sticker){const sc2=brand.palette[Object.keys(brand.palette)[(si+3)%4]];el.style.setProperty('--stk',sc2);el.style.setProperty('--stkfg',darkBg(sc2)?'#fff':'#16110f')}
 const sceneDark=darkBg(SC.bg||R.background), VAR=sceneDark?'onDark':'onLight';
 tl.set(cornerD,{opacity:sceneDark?1:0},Math.max(0,A-OV/2));tl.set(cornerL,{opacity:sceneDark?0:1},Math.max(0,A-OV/2));
 if(WIPE&&si>0)tl.fromTo(el,{clipPath:'inset(0 0 0 100%)'},{clipPath:'inset(0 0 0 0%)',duration:OV,ease:'power4.inOut',immediateRender:false},A-OV);
 const AL=TX.align||'center', boost=TX.sizeBoost||1;
 const sceneDrift=(target,amt)=>tl.fromTo(target,{y:(si%2?-amt:0)*u},{y:(si%2?0:-amt)*u,duration:D+2*OV,ease:'sine.inOut'},Math.max(0,A-OV));
 if(sc.type==='hook'){
   const iw=(portrait?220:180)*u, il=W/2-iw/2, it=H/2-(portrait?330:300)*u;
   const icon=logoImg(el,'icon',iw,{left:il+'px',top:it+'px',transformOrigin:'0 0'},VAR);
   const h=makeText(el,sc.copy,{max:150*u*boost,width:safe.w/1.06,maxLines:portrait?(UP?4:3):(UP?2:1),align:AL,x:AL==='left'?safe.l:safe.l+safe.w*(1-1/1.06)/2,y:H/2+(portrait?0:20)*u,anchorY:'top'});if(AL==='left')h.style.transformOrigin='0 50%';
   tl.fromTo(icon,{scale:.2+.6*(1-ROT),rotation:-90*ROT,opacity:0},{scale:1,rotation:0,opacity:1,duration:.8,ease:OVR},A+.05);
   letters(h,A+.3,vt()+.15,vd()+.1);tl.fromTo(h,{scale:1.06},{scale:1,duration:D+OV,ease:'sine.out'},A+.3);sceneDrift(h,14);
   exitLetters(h,A+D-.6,.32);
   // match cut: the hook icon flies into the corner mark position
   if(brand.cornerMark){const cmH=cmW/brand.logo.full.aspect;
     tl.to(icon,{x:safe.l-il,y:parseFloat(corner.style.top)-it,scale:cmH/iw,duration:.75,ease:'power3.inOut'},A+D-.5);
     tl.set(icon,{opacity:0},A+D+.25);hookIcon.at=A+D+.25;}
   else tl.to(icon,{opacity:0,scale:.8,duration:.4,ease:'power3.in'},A+D-.35);
   qaTimes.push(A+Math.min(D-.45,1.9));
 }
 if(sc.type==='phrase'){
   const h=makeText(el,sc.copy,{max:(portrait?170:190)*u*boost,width:safe.w/1.12,maxLines:portrait?(UP?4:3):2,align:AL,x:AL==='left'?safe.l:safe.l+safe.w*(1-1/1.12)/2,y:H/2,anchorY:'center'});if(AL==='left')h.style.transformOrigin='0 50%';
   letters(h,A-.02,.2+vr()*.12,.45+vr()*.15);tl.fromTo(h,{scale:1.1},{scale:1,duration:D+OV,ease:'expo.out'},A-.02);sceneDrift(h,10);
   tl.fromTo(flash,{opacity:LIGHT?.22:.8,scale:1.25},{opacity:LIGHT?.05:.12,scale:1,duration:D*.9,ease:'power2.out'},A);
   if(!last){exitLetters(h,A+D-.34,.28);tl.to(h,{opacity:0,duration:.2,ease:'power2.in'},A+D-.12)}
   qaTimes.push(A+.6);
 }
 if(sc.type==='outro'){
   const lw=Math.min(safe.w,(portrait?860:900)*u);const lh=lw/brand.logo.full.aspect;
   const ty=H/2-(lh+200*u)/2;
   const grp=$('div','',el,{position:'absolute',inset:0,transformOrigin:'50% 50%'});
   const wrap=$('div','',grp,{position:'absolute',left:W/2-lw/2+'px',top:ty+'px',width:lw+'px',height:lh*1.1+'px',overflow:'hidden'});
   const logo=logoImg(wrap,'full',lw,{left:0,top:0},VAR);
   const tag=makeText(grp,sc.tagline||brand.tagline,{max:52*u,width:safe.w/1.03,maxLines:2,weight:F.display.weight>=800?700:F.display.weight,tracking:0,color:SC.fg,x:safe.l+safe.w*.015,y:ty+lh+40*u});
   const offerTxt=sc.offer??(brand.messaging||{}).offer;let offer=null;if(offerTxt){offer=$('div','txt lab',grp,{left:safe.l+safe.w*.015+'px',width:safe.w/1.03+'px',textAlign:'center',fontSize:24*u+'px',fontWeight:500,letterSpacing:'.04em',color:SC.fg,opacity:.75,top:tag.offsetTop+tag.offsetHeight+22*u+'px',textTransform:'none'});offer.textContent=offerTxt;let ofs=24*u;while(offer.scrollWidth>offer.clientWidth&&ofs>12){offer.style.fontSize=(ofs*=.95)+'px'}textEls.push(offer)}
   const below=offer?offer.offsetTop+offer.offsetHeight:tag.offsetTop+tag.offsetHeight;
   const ctaH=100*u;const cta=$('div','cta',grp,{background:`linear-gradient(90deg,${R.ctaGradient.join(',')})`,boxShadow:`0 ${20*u}px ${60*u}px ${R.ctaGradient[0]}${LIGHT?'44':'88'}`,fontWeight:800,height:ctaH+'px',padding:`0 ${60*u}px`});
   const ct=$('span','txt',cta,{position:'relative'});ct.textContent=sc.cta||brand.cta;if(STY.device.shadow==='hard'){cta.style.background=SC.kw&&BG.type==='flat-cycle'?SC.kw:R.ctaGradient[0];cta.style.color=BG.type==='flat-cycle'&&!darkBg(SC.kw)?'#16110f':'#fff';cta.style.border=`${4*u}px solid #16110f`;cta.style.boxShadow=`${8*u}px ${8*u}px 0 #16110f`}
   let fs=38*u;cta.style.fontSize=fs+'px';while(cta.offsetWidth>safe.w/1.06&&fs>16)cta.style.fontSize=(fs*=.95)+'px';
   cta.style.left=W/2-cta.offsetWidth/2+'px';cta.style.top=below+44*u+'px';textEls.push(cta);
   tl.fromTo(logo,{yPercent:105,filter:`blur(${BL*u}px)`},{yPercent:0,filter:'blur(0px)',duration:1,ease:'expo.out'},A-.15);
   letters(tag,A+.65,vt(),vd());if(offer)tl.fromTo(offer,{opacity:0,y:14*u},{opacity:.75,y:0,duration:.6,ease:EASE},A+.95);
   tl.fromTo(cta,{opacity:0,y:50*u,scale:.92},{opacity:1,y:0,scale:1,duration:.8,ease:OVR},A+1.15);
   tl.fromTo(grp,{scale:1},{scale:1.025,duration:D+.2,ease:'sine.inOut'},A-.15);
   const press=A+Math.max(2.5,D-1.5);tl.to(cta,{scale:.95,duration:.12,ease:'power2.in'},press).to(cta,{scale:1,duration:.5,ease:OVR},press+.12);
   tl.fromTo(flash,{opacity:0},{opacity:LIGHT?.2:.55,duration:1.2,ease:'sine.inOut'},A+1);

 }
 if(sc.type==='device'){
   const phone=sc.device==='phone';
   const match=prev&&prev.type==='device'&&prev.device===sc.device;           // same device continues: match cut
   const nextMatch=next&&next.type==='device'&&next.device===sc.device;
   const lab=$('div','',el,{position:'absolute',inset:0,zIndex:30});
   const labTop=safe.t+(portrait?90:70)*u;
   const kick=$('div','txt lab',lab,{left:safe.l+'px',top:labTop+'px',fontSize:22*u+'px',letterSpacing:'.3em',fontWeight:F.label.weight||700,color:SC.kw||R.accent,textTransform:'uppercase',whiteSpace:'nowrap'});kick.textContent=sc.kicker;textEls.push(kick);
   const title=makeText(lab,sc.title,{max:(portrait?96:68)*u,width:safe.w,maxLines:2,align:'left',x:safe.l,y:labTop+40*u});
   const areaT=title.offsetTop+title.offsetHeight+(portrait?50:36)*u, areaB=safe.b, areaW=portrait?safe.w:W*.8;
   const drift=$('div','cam',el,{transformOrigin:`${W/2}px ${H/2}px`});
   const cam=$('div','cam',drift,{transformOrigin:`${W/2}px ${H/2}px`});
   const dev=$('div','device',cam);
