<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FORM — everyday objects</title>
  <style>
    @font-face{font-family:Manrope;src:url('./fonts/manrope.ttf') format('truetype');font-weight:200 800;font-display:block}
    :root{--paper:#f5f1e7;--ink:#173b34;--accent:#d7fb56;--muted:#65766a;--line:#d6ddcd;--coral:#ee8c64;--white:#fffef9;--wash:#e1e8d9;--shadow:#173b3420}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid var(--coral);outline-offset:4px}button,a{-webkit-tap-highlight-color:transparent}
    header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 23px;border-bottom:1px solid var(--line)}.brand{border:0;background:none;font-size:30px;letter-spacing:-2px;font-weight:800;padding:0}.brand span{color:var(--coral)}.bag{background:var(--ink);color:var(--paper);border:0;border-radius:24px;padding:10px 17px;font-weight:700;font-size:12px}.bag b{background:var(--accent);color:var(--ink);border-radius:50%;padding:2px 6px;margin-left:8px}
    main{max-width:700px;margin:auto;padding:22px 23px 90px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.hero{position:relative;overflow:hidden;padding:17px 0 23px}.hero h1{position:relative;margin:9px 0 13px;font-size:43px;line-height:1;letter-spacing:-2.5px;font-weight:800}.hero p{font-size:12px;max-width:240px;line-height:1.6;color:var(--muted);margin:0}.sun{position:absolute;right:-31px;top:17px;width:145px;height:145px;border-radius:50%;background:var(--accent);z-index:0}.hero h1,.hero .eyebrow,.hero p{z-index:1;position:relative}.tag{position:absolute;right:3px;top:65px;transform:rotate(-12deg);font-size:10px;font-weight:800;border:1px solid var(--ink);border-radius:50%;padding:22px 8px;background:var(--accent)}
    .section-row{display:flex;justify-content:space-between;align-items:center;margin:15px 0 16px}.section-row h2{font-size:17px;letter-spacing:-.7px;margin:0}.section-row span{font-size:10px;color:var(--muted)}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{padding:0;text-align:left;border:0;background:none;min-width:0}.art{background:var(--wash);border-radius:13px;overflow:hidden;position:relative}.art svg{display:block;width:100%;height:auto}.card h3{font-size:13px;line-height:1.35;margin:12px 0 5px;font-weight:800}.card p{display:flex;justify-content:space-between;font-size:12px;margin:0}.stock{font-size:9px;color:var(--muted);margin-top:7px;display:block}.flag{position:absolute;top:11px;left:11px;font-size:8px;background:var(--white);padding:5px 8px;border-radius:20px;font-weight:800}.feature{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);margin-top:24px;padding-top:20px;font-size:11px;line-height:1.5}.feature strong{font-size:12px}.feature .icon{font-size:20px}.feature p{margin:0;color:var(--muted)}
    .back{border:0;background:none;padding:0;margin:0 0 18px;font-size:11px;font-weight:700}.product-art{border-radius:18px;background:var(--wash);overflow:hidden}.product-art svg{width:100%;display:block}.detail-top{display:flex;justify-content:space-between;align-items:center;margin:21px 0 7px}.pill{font-size:9px;font-weight:800;background:var(--accent);padding:6px 10px;border-radius:20px}.detail h1{font-size:30px;letter-spacing:-1.3px;line-height:1.12;margin:9px 0}.detail p{font-size:12px;line-height:1.6;color:var(--muted);margin:9px 0}.price{font-size:25px;font-weight:800;letter-spacing:-1px}.primary{width:100%;border:0;background:var(--ink);color:var(--paper);padding:16px;border-radius:10px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-top:21px}.primary span{color:var(--accent)}.notice{font-size:11px;padding:10px;margin-top:9px;background:var(--accent);border-radius:8px;font-weight:700}.bottom-note{font-size:9px;letter-spacing:.6px;text-align:center;color:var(--muted);margin:13px 0}
    .page-title{font-size:34px;letter-spacing:-1.6px;line-height:1.1;margin:12px 0 10px}.steps{font-size:9px;letter-spacing:1px;color:var(--muted);padding:13px 0 27px;display:flex;justify-content:space-between}.steps strong{color:var(--ink)}.cart-line{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:19px 0}.mini{width:95px;flex-shrink:0;background:var(--wash);border-radius:10px}.mini svg{display:block;width:100%}.cart-copy{flex:1;font-size:11px}.cart-copy h2{font-size:14px;margin:0 0 8px}.cart-copy p{margin:5px 0;color:var(--muted)}.remove{padding:0;background:none;border:0;text-decoration:underline;font-size:10px}.totals{margin:23px 0}.totals div{display:flex;justify-content:space-between;padding:10px 0;font-size:12px}.totals .total{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:10px;padding-top:18px}.delivery{padding:20px;background:var(--wash);border-radius:13px;font-size:12px;line-height:1.65}.delivery strong{display:block}.delivery p{margin:6px 0 0;color:var(--muted)}
    .success{padding:28px 0}.check{width:95px;height:95px;background:var(--accent);border-radius:50%;display:grid;place-items:center;margin:0 0 31px;font-size:43px}.success p{font-size:13px;line-height:1.7;color:var(--muted)}.receipt{margin:30px 0;padding:23px;background:var(--white);border:1px solid var(--line);border-radius:14px}.receipt div{display:flex;justify-content:space-between;font-size:12px;line-height:2}.receipt strong{display:block;margin-bottom:13px;font-size:14px}.receipt .sum{border-top:1px dashed var(--line);margin-top:13px;padding-top:13px;font-weight:800}
    footer{position:fixed;bottom:0;left:0;right:0;height:49px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 23px;font-size:8px;letter-spacing:1px;font-weight:700}footer span:last-child{color:var(--muted)}[hidden]{display:none!important}@media(min-width:700px){main{padding-top:35px}.hero h1{font-size:70px}.sun{right:45px}.tag{right:60px}.catalog{gap:25px}.hero p{font-size:15px;max-width:360px}.product-art{max-width:360px;margin:auto}header,footer{padding-left:max(23px,calc((100vw - 654px)/2));padding-right:max(23px,calc((100vw - 654px)/2))}}
  </style>
</head>
<body>
  <header><button class="brand" id="home" aria-label="FORM home">FORM<span>®</span></button><button class="bag" id="view-cart">Your bag <b id="bag-count">0</b></button></header>
  <main id="app" aria-live="polite"></main>
  <footer><span>DESIGNED FOR EVERY DAY</span><span>FICTIONAL DEMO STORE</span></footer>
  <script>
    const products = [
      {id:'arc-headphones',name:'Arc headphones',price:129,stock:8,tone:'Sage / matte finish',description:'Less noise. More focus. Wireless over-ear sound with soft-touch cushions and a 32-hour battery.',art:'headphones'},
      {id:'orbit-lamp',name:'Orbit desk lamp',price:79,stock:12,tone:'Terracotta / warm light',description:'A sculptural companion for your workspace. Adjustable warm light in a compact, considered shape.',art:'lamp'}
    ];
    const cart = new Map(); let selected=products[0]; let lastOrder=null;
    const app=document.querySelector('#app');
    const money=n=>'$'+n.toFixed(2);
    const art=kind=>kind==='headphones'?`<svg viewBox="0 0 340 280" role="img" aria-label="Sage green over-ear headphones illustration"><defs><linearGradient id="band" x2="1" y2="1"><stop stop-color="#749086"/><stop offset="1" stop-color="#294c42"/></linearGradient></defs><rect width="340" height="280" fill="#e0e8d9"/><circle cx="180" cy="123" r="100" fill="#c6d2bd"/><ellipse cx="174" cy="244" rx="83" ry="12" fill="#173b3420"/><path d="M94 170V111C94 17 248 17 248 111V170" fill="none" stroke="#243e35" stroke-width="24"/><path d="M94 152V109C94 32 248 32 248 109V152" fill="none" stroke="url(#band)" stroke-width="17"/><g transform="rotate(-9 102 185)"><rect x="73" y="137" width="57" height="94" rx="26" fill="#284a3f"/><rect x="83" y="144" width="43" height="79" rx="21" fill="#749086"/><path d="M92 154V213" stroke="#a4b8ac" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(9 243 185)"><rect x="214" y="137" width="57" height="94" rx="26" fill="#284a3f"/><rect x="218" y="144" width="43" height="79" rx="21" fill="#749086"/><path d="M251 157V206" stroke="#a4b8ac" stroke-width="3" stroke-linecap="round"/></g></svg>`:`<svg viewBox="0 0 340 280" role="img" aria-label="Terracotta desk lamp illustration"><rect width="340" height="280" fill="#ecd3bc"/><circle cx="155" cy="130" r="100" fill="#e3bea2"/><ellipse cx="172" cy="245" rx="80" ry="11" fill="#58372120"/><path d="M168 121V225" stroke="#8f4c33" stroke-width="17"/><ellipse cx="170" cy="227" rx="61" ry="13" fill="#a65c3d"/><path d="M83 137C94 33 246 33 257 137Z" fill="#cf7850"/><ellipse cx="170" cy="137" rx="87" ry="13" fill="#9c5035"/><ellipse cx="170" cy="137" rx="67" ry="7" fill="#ffdfaa"/><path d="M106 112C113 74 137 60 158 58" stroke="#eaa280" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
    const updateBag=()=>document.querySelector('#bag-count').textContent=[...cart.values()].reduce((a,b)=>a+b,0);
    const bind=()=>{document.querySelectorAll('[data-product]').forEach(button=>button.onclick=()=>showProduct(button.dataset.product));};
    function catalog(){
      app.innerHTML=`<section class="hero"><div class="sun"></div><div class="eyebrow">Good things, in stock.</div><h1>Everyday.<br>Extraordinary.</h1><p>Considered objects for the way you live, work and unwind.</p><div class="tag">LESS, BUT<br>BETTER.</div></section><div class="section-row"><h2>The everyday edit</h2><span>02 considered objects</span></div><section class="catalog" id="catalog">${products.map(p=>`<button class="card" data-product="${p.id}" aria-label="View ${p.name}"><div class="art">${art(p.art)}<span class="flag">${p.art==='headphones'?'BESTSELLER':'NEW ARRIVAL'}</span></div><h3>${p.name}</h3><p><strong>${money(p.price)}</strong><span>↗</span></p><span class="stock">● ${p.stock} in stock</span></button>`).join('')}</section><div class="feature"><span class="icon">↗</span><div><strong>Ready when you are.</strong><p>In-stock essentials. Free demo delivery.</p></div></div>`;
      bind();window.scrollTo(0,0);
    }
    function showProduct(id){
      selected=products.find(p=>p.id===id);const p=selected;
      app.innerHTML=`<button class="back" id="back-catalog">← Back to the edit</button><section class="detail" id="product-detail"><div class="product-art">${art(p.art)}</div><div class="detail-top"><span class="eyebrow">The everyday collection</span><span class="pill" id="product-stock">${p.stock} available</span></div><h1>${p.name}</h1><div class="price">${money(p.price)}</div><p>${p.description}</p><div class="eyebrow">${p.tone}</div><button class="primary" id="add-to-cart" ${p.stock<=(cart.get(p.id)||0)?'disabled':''}>Add to bag <span>＋</span></button><div class="notice" id="added-notice" role="status" hidden>Added to your bag. Ready to review.</div><div class="bottom-note">FREE DELIVERY · NO REAL PAYMENT</div></section>`;
      document.querySelector('#back-catalog').onclick=catalog;
      document.querySelector('#add-to-cart').onclick=()=>{const quantity=cart.get(p.id)||0;if(quantity>=p.stock)return;cart.set(p.id,quantity+1);updateBag();document.querySelector('#added-notice').hidden=false;if(quantity+1>=p.stock)document.querySelector('#add-to-cart').disabled=true;};
      window.scrollTo(0,0);
    }
    function showCart(){
      const items=products.filter(p=>cart.has(p.id));const total=items.reduce((sum,p)=>sum+p.price*cart.get(p.id),0);
      app.innerHTML=`<div class="eyebrow">One step closer.</div><h1 class="page-title">Your good things.</h1><div class="steps"><strong>01 BAG</strong><span>02 DEMO CHECKOUT</span><span>03 CONFIRMED</span></div><section id="cart-items">${items.length?items.map(p=>`<div class="cart-line"><div class="mini">${art(p.art)}</div><div class="cart-copy"><h2>${p.name}</h2><p>${p.tone}</p><p>Quantity: ${cart.get(p.id)} · ${money(p.price)}</p><button class="remove" data-remove="${p.id}">Remove</button></div></div>`).join(''):'<p>Your bag is empty.</p>'}</section><section class="totals"><div><span>Subtotal</span><strong>${money(total)}</strong></div><div><span>Demo delivery</span><strong>On us</strong></div><div class="total"><span>Total</span><span id="cart-total">${money(total)}</span></div></section><div class="delivery"><strong>A little less waiting.</strong><p>Your items are in stock and ready. This is a simulated checkout: no address or payment details required.</p></div><button class="primary" id="checkout" ${items.length?'':'disabled'}>Place demo order <span>↗</span></button><div class="bottom-note">SIMULATED PURCHASE · NO CHARGE</div>`;
      document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{cart.delete(button.dataset.remove);updateBag();showCart();});
      document.querySelector('#checkout').onclick=()=>{
        if(!cart.size)return;
        for(const p of items)if((cart.get(p.id)||0)>p.stock)throw new Error('Not enough stock');
        lastOrder={items:items.map(p=>({name:p.name,quantity:cart.get(p.id),price:p.price})),total};
        for(const p of items)p.stock-=cart.get(p.id);cart.clear();updateBag();confirmation();
      };window.scrollTo(0,0);
    }
    function confirmation(){app.innerHTML=`<section class="success" id="confirmation"><div class="check">✓</div><div class="eyebrow">Good choice.</div><h1 class="page-title">Order confirmed.</h1><p>Your everyday just got an upgrade.<br>This demo order is complete. No payment was processed.</p><div class="receipt"><strong>FORM / DEMO-001</strong>${lastOrder.items.map(p=>`<div><span>${p.name} × ${p.quantity}</span><span>${money(p.price*p.quantity)}</span></div>`).join('')}<div><span>Demo delivery</span><span>Free</span></div><div class="sum"><span>Total</span><span>${money(lastOrder.total)}</span></div></div><button class="primary" id="continue-shopping">Back to the edit <span>↗</span></button><div class="bottom-note">STOCK UPDATED · BAG CLEARED</div></section>`;document.querySelector('#continue-shopping').onclick=catalog;window.scrollTo(0,0);}
    document.querySelector('#home').onclick=catalog;document.querySelector('#view-cart').onclick=showCart;catalog();
  </script>
</body>
</html>
